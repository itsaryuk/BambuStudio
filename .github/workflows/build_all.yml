name: Build all

on:
  push:
    branches:
     - master
    tags:
     - 'steroids-v*'   # a release: builds, then publishes the builds as a GitHub release
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'bbl/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"

  pull_request:
    branches:
     - master
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'BuildLinux.sh'
     - 'build_win.bat'
    
  workflow_dispatch: # manual dispatch
      inputs:
        build-deps-only:
            description: 'Only build dependencies (bypasses caching)'
            type: boolean
            default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_all:
    name: Build All
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-15   # BuildMac.sh -a universal: one app for Apple silicon and Intel
            arch: universal
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/steroids-v')
    needs: build_all
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the builds of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download ${{ github.run_id }} --dir dist
          gh release create "${{ github.ref_name }}" --title "ON STEROIDS ${GITHUB_REF_NAME#steroids-v}" --generate-notes dist/*/*.zip
